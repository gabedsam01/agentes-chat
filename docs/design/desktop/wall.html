<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop wallpaper</title>
<!-- The agents' desktop wallpaper (1280×900), drawn by out/wall.js: render.sh screenshots this page. -->
<style>
@font-face {
  font-family: "Instrument Serif";
  font-style: normal;
  font-weight: 400;
  src: url("../../../apps/web/src/fonts/instrument-serif-latin-400-normal.woff2") format("woff2");
}
@font-face {
  font-family: "Instrument Serif";
  font-style: italic;
  font-weight: 400;
  src: url("../../../apps/web/src/fonts/instrument-serif-latin-400-italic.woff2") format("woff2");
}
html, body { margin: 0; overflow: hidden; background: #000; }
.wall { position: relative; width: 1280px; height: 900px; overflow: hidden; }
.wall > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
/* The expanded logo as the app draws it (packages/ui Logo, components.css .ac-logo): Instrument Serif + italic "chat". */
.logo {
  position: absolute;
  display: inline-flex;
  align-items: center;
  gap: 0.22em;
  font-family: "Instrument Serif";
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1;
  white-space: nowrap;
}
.logo svg { width: 1.15em; height: 1.15em; flex: none; }
.logo .word { display: inline-flex; align-items: baseline; }
.logo .chat {
  font-style: italic;
}
</style>
</head>
<body>
<div class="wall"><canvas></canvas></div>
<script src="out/wall.js"></script>
</body>
</html>
